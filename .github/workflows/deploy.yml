name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Deploy an existing tag instead of building (rollback), e.g. sha-1a2b3c4"
        required: false
        default: ""

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_WEB: ghcr.io/ambag12/pm-web
  GHCR_USER: ${{ vars.GHCR_USERNAME || github.repository_owner }}
  # Public API URL compiled into the bundle (override with the repo variable VITE_API_URL)
  VITE_API_URL: ${{ vars.VITE_API_URL || 'https://pm-api.socketsoft.io/api/v1/' }}

jobs:
  test:
    if: ${{ !inputs.image_tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ env.GHCR_USER }}
          password: ${{ secrets.PM_PUSH }}
      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_API_URL=${{ env.VITE_API_URL }}
          tags: |
            ${{ env.IMAGE_WEB }}:${{ steps.vars.outputs.tag }}
            ${{ env.IMAGE_WEB }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || (inputs.image_tag != '' && needs.build.result == 'skipped')) }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://pm.socketsoft.io
    env:
      APP_DIR: /opt/pm
      SOCKETSOFT_DIR: /opt/socketsoft
      PUBLIC_URL: https://pm.socketsoft.io
      HEALTH_PATH: /health
      IMAGE_TAG: ${{ inputs.image_tag || needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host vps\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n  ServerAliveInterval 30\n' \
            "$SSH_HOST" "$SSH_USER" "$SSH_PORT" > ~/.ssh/config
          ssh vps 'docker version --format "server docker {{.Server.Version}}" && docker compose version'

      - name: Upload compose file and Caddy site file
        run: |
          ssh vps "mkdir -p '$APP_DIR/deploy'"
          scp docker-compose.yml "vps:$APP_DIR/docker-compose.yml"
          scp deploy/pm.caddy "vps:$APP_DIR/deploy/pm.caddy"

      - name: Write .env on the server
        run: |
          {
            echo "# Written by GitHub Actions (deploy.yml). Change the repository secrets/variables instead."
            echo "IMAGE_TAG=$IMAGE_TAG"
            echo "WEB_IMAGE=$IMAGE_WEB"
          } | ssh vps "umask 077 && cat > '$APP_DIR/.env'"

      - name: Log the server in to GHCR (private images)
        env:
          PULL_TOKEN: ${{ secrets.PM_PULL }}
        run: |
          test -n "$PULL_TOKEN" || { echo "::error::Secret PM_PULL is missing"; exit 1; }
          printf '%s' "$PULL_TOKEN" | ssh vps "docker login ghcr.io -u '$GHCR_USER' --password-stdin"

      - name: Deploy on the server
        run: |
          ssh vps "APP_DIR='$APP_DIR' SOCKETSOFT_DIR='$SOCKETSOFT_DIR' PUBLIC_URL='$PUBLIC_URL' HEALTH_PATH='$HEALTH_PATH' IMAGE_TAG='$IMAGE_TAG' APP='pm' IMAGES='$IMAGE_WEB' bash -s" <<'REMOTE'
          set -euo pipefail
          log() { printf '\n==> %s\n' "$*"; }
          die() { printf '\nERROR: %s\n' "$*" >&2; exit 1; }
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          cd "$APP_DIR"

          # 1. Find the socketsoft Caddy.
          log "Locating the Caddy container of $SOCKETSOFT_DIR"
          read -r CADDY CADDY_SERVICE < <(docker ps \
              --filter "label=com.docker.compose.project.working_dir=$SOCKETSOFT_DIR" \
              --format '{{.ID}} {{.Image}} {{.Label "com.docker.compose.service"}}' \
            | awk '$2 ~ /caddy/ {print $1, $3; exit}') || true
          [ -n "${CADDY:-}" ] || die "No running Caddy from $SOCKETSOFT_DIR. Start the socketsoft stack first."

          # 2. One-time: Caddy must import $SOCKETSOFT_DIR/sites/*.caddy (already done on this server; kept for new servers).
          if ! docker inspect -f '{{range .Mounts}}{{println .Destination}}{{end}}' "$CADDY" | grep -qx /etc/caddy/sites \
             || ! grep -q 'import /etc/caddy/sites/' "$SOCKETSOFT_DIR/Caddyfile"; then
            log "One-time edge setup in $SOCKETSOFT_DIR"
            cd "$SOCKETSOFT_DIR"; mkdir -p sites
            [ -f Caddyfile.bak-edge ] || cp Caddyfile Caddyfile.bak-edge
            grep -q 'import /etc/caddy/sites/' Caddyfile || printf '\nimport /etc/caddy/sites/*.caddy\n' >> Caddyfile
            if [ -f docker-compose.override.yml ]; then
              grep -q '/etc/caddy/sites' docker-compose.override.yml || die "override exists: add '- ./sites:/etc/caddy/sites:ro' to services.$CADDY_SERVICE.volumes by hand."
            else
              printf 'services:\n  %s:\n    volumes:\n      - ./sites:/etc/caddy/sites:ro\n' "$CADDY_SERVICE" > docker-compose.override.yml
            fi
            docker compose config --quiet || die "socketsoft compose invalid after override."
            docker compose up -d "$CADDY_SERVICE"; sleep 3
            CADDY="$(docker ps -q --filter "label=com.docker.compose.project.working_dir=$SOCKETSOFT_DIR" --filter "label=com.docker.compose.service=$CADDY_SERVICE" | head -n1)"
            [ -n "$CADDY" ] || die "Caddy did not come back; restore $SOCKETSOFT_DIR/Caddyfile.bak-edge."
            cd "$APP_DIR"
          fi

          # 3. Join Caddy's network.
          EDGE_NETWORK="$(docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{println $k}}{{end}}' "$CADDY" | grep -v '^$' | head -n1)"
          [ -n "$EDGE_NETWORK" ] || die "Could not determine Caddy's network."
          grep -v '^EDGE_NETWORK=' .env > .env.tmp || true
          printf 'EDGE_NETWORK=%s\n' "$EDGE_NETWORK" >> .env.tmp && mv .env.tmp .env && chmod 600 .env
          export IMAGE_TAG EDGE_NETWORK

          # 4. Pull, log out, start, wait for health.
          log "docker compose pull"; docker compose pull
          docker logout ghcr.io >/dev/null 2>&1 || true
          log "docker compose up"
          docker compose up -d --remove-orphans --wait --wait-timeout 240 \
            || { docker compose ps; docker compose logs --tail 80; die "Stack did not become healthy."; }
          docker compose ps

          # 5. Install the Caddy site file (validate → reload or restart; restore on failure).
          log "Caddy site file"
          TARGET="$SOCKETSOFT_DIR/sites/$APP.caddy"
          if cmp -s "deploy/$APP.caddy" "$TARGET"; then echo "unchanged"; else
            [ -f "$TARGET" ] && cp -p "$TARGET" "$TARGET.prev"
            install -m 0644 "deploy/$APP.caddy" "$TARGET"
            if docker exec "$CADDY" caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile >/dev/null; then
              docker exec "$CADDY" caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile >/dev/null 2>&1 || docker restart "$CADDY" >/dev/null
              echo "Caddy reloaded"
            else
              if [ -f "$TARGET.prev" ]; then mv "$TARGET.prev" "$TARGET"; else rm -f "$TARGET"; fi
              die "$APP.caddy is invalid; previous file restored, Caddy untouched."
            fi
          fi

          # 6. Smoke test through Caddy (first deploy waits for the certificate).
          log "Smoke test $PUBLIC_URL$HEALTH_PATH"
          for i in $(seq 1 24); do
            curl -fsS --max-time 10 "$PUBLIC_URL$HEALTH_PATH" >/dev/null 2>&1 && { echo OK; break; }
            [ "$i" -eq 24 ] && { docker logs --tail 40 "$CADDY"; die "no answer from $PUBLIC_URL$HEALTH_PATH"; }
            sleep 5
          done

          # 7. Keep current + two previous image tags.
          log "Cleanup"
          for repo in $IMAGES; do
            docker images "$repo" --format '{{.Tag}}' | grep '^sha-' | grep -vx "$IMAGE_TAG" | tail -n +3 \
              | sed "s|^|$repo:|" | xargs -r docker rmi >/dev/null 2>&1 || true
          done
          docker image prune -f >/dev/null
          log "Deployed $IMAGE_TAG"
          REMOTE
